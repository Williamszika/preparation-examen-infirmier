<title>Examen Pflege Übungsprüfung</title>

<style>
/* Layout: ein Prüfungsbogen — Deckblatt, Fall, Aufgaben untereinander; die Korrektur steht in Rotstift am Rand. */
:root{
  --paper:#f4f6f5; --sheet:#ffffff; --ink:#18202c; --soft:#566173; --line:#d6dce2;
  --blue:#1d4aa0; --bluebg:#e7eefb; --red:#b8322a; --redbg:#fbecea;
  --good:#24724a; --goodbg:#e4f3ea; --warn:#8a5a00; --warnbg:#fbf1dc;
  --f-ui:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-text:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-pen:"Kalam","Comic Sans MS","Segoe Print",cursive;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#101419; --sheet:#171c23; --ink:#e6eaf0; --soft:#9aa5b4; --line:#2b333d;
  --blue:#8fb2f2; --bluebg:#18243a; --red:#ff8d80; --redbg:#36191a;
  --good:#7fd2a1; --goodbg:#15291e; --warn:#e6b65c; --warnbg:#2f2513; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#101419; --sheet:#171c23; --ink:#e6eaf0; --soft:#9aa5b4; --line:#2b333d;
  --blue:#8fb2f2; --bluebg:#18243a; --red:#ff8d80; --redbg:#36191a;
  --good:#7fd2a1; --goodbg:#15291e; --warn:#e6b65c; --warnbg:#2f2513; color-scheme:dark}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
h1,h2,h3{font-family:var(--f-ui);text-wrap:balance;line-height:1.2;margin:0}
h1{font-size:1.6rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
button{font:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.lbl{font-size:.74rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.muted{color:var(--soft)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* Kopf */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet);border-bottom:1px solid var(--line)}
header.top .in{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.brand{font-weight:700;font-size:1.02rem;letter-spacing:.01em}
.brand small{display:block;font-weight:500;font-size:.75rem;color:var(--soft);letter-spacing:.06em;text-transform:uppercase}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs a{color:var(--ink);text-decoration:none;padding:6px 10px;border-radius:var(--r);font-weight:600;font-size:.92rem}
nav.tabs a[aria-current="page"]{background:var(--bluebg);color:var(--blue)}

/* Uhr */
.clock{position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);z-index:4;background:var(--ink);color:var(--sheet);border-radius:0 0 var(--r) var(--r);padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin-bottom:16px}
.clock .t{font-variant-numeric:tabular-nums;font-size:1.7rem;font-weight:700;letter-spacing:.02em}
.clock.low{background:var(--red);color:#fff}
.clock .bar{flex:1 1 160px;height:6px;background:color-mix(in srgb,var(--sheet) 25%,transparent);border-radius:3px;overflow:hidden;min-width:120px}
.clock .bar i{display:block;height:100%;background:var(--sheet)}
.clock.low .bar i{background:#fff}
.clock .saved{font-size:.8rem;opacity:.85}

/* Knöpfe */
.btn{border:1.5px solid var(--ink);background:var(--sheet);color:var(--ink);padding:9px 16px;border-radius:var(--r);font-weight:600}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--sheet)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{border-color:var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.big{font-size:1.1rem;padding:14px 26px}
.clock .btn{background:transparent;color:inherit;border-color:currentColor}

/* Startseite */
.intro{padding-block:22px 6px;display:flex;flex-direction:column;gap:8px}
.days{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:16px}
@media (max-width:720px){.days{grid-template-columns:1fr}}
.day{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.day .head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.day .num{font-size:2rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.var{border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.var .vh{display:flex;justify-content:space-between;gap:8px;align-items:center}
.var .vh b{font-size:1rem}
.var ul{margin:0;padding-left:18px;font-size:.84rem;color:var(--soft)}
.pill{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--ink);white-space:nowrap}
.pill.go{background:var(--bluebg);color:var(--blue)}
.pill.run{background:var(--warnbg);color:var(--warn)}
.pill.done{background:var(--goodbg);color:var(--good)}
.pill.wait{background:transparent;border:1px dashed var(--line);color:var(--soft)}
.oral{margin-top:16px;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between}

/* Bogen */
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:clamp(16px,4vw,32px);display:flex;flex-direction:column;gap:18px}
.cover dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px;margin:0}
.cover dt{color:var(--soft);font-weight:600}
.cover dd{margin:0;font-variant-numeric:tabular-nums}
.locked{border:2px dashed var(--line);border-radius:var(--r);padding:28px 16px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.locked .lock{font-size:2rem;line-height:1}
.fall{font-family:var(--f-text);font-size:1.05rem;line-height:1.65;max-width:68ch;display:flex;flex-direction:column;gap:10px}
.task{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:10px}
.task .meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.task .nr{font-weight:700;font-size:1.05rem;font-variant-numeric:tabular-nums}
.task .op{font-weight:700;color:var(--blue)}
.task .q{font-family:var(--f-text);font-size:1.03rem;max-width:68ch}
.task .pts{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
textarea{width:100%;box-sizing:border-box;min-height:140px;resize:vertical;border:1px solid var(--line);border-radius:var(--r);background:var(--paper);color:var(--ink);font-family:var(--f-text);font-size:1rem;line-height:1.55;padding:10px 12px}
textarea[readonly]{background:transparent;border-style:dashed}
.note{border-radius:var(--r);padding:10px 12px;font-size:.92rem}
.note.info{background:var(--bluebg)}
.note.warn{background:var(--warnbg)}
.note.ok{background:var(--goodbg)}

/* Korrektur */
.grade{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:flex-end;border:2px solid var(--red);border-radius:var(--r);padding:16px}
.grade .n{font-family:var(--f-pen);color:var(--red);font-size:3.2rem;line-height:1}
.grade .s{font-variant-numeric:tabular-nums}
.cmp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:640px){.cmp{grid-template-columns:1fr}}
.cmp > div{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-width:0}
.cmp .yours{white-space:pre-wrap;font-family:var(--f-text)}
.cmp ul{margin:0;padding-left:18px}
.cmp li.hit::marker{color:var(--good)}
.pen{font-family:var(--f-pen);color:var(--red);font-size:1.08rem;line-height:1.4}
.pen .sc{font-weight:700;font-size:1.3rem}
.src{font-size:.75rem;color:var(--soft)}
.lang{font-size:.9rem}
.lang s{color:var(--red)}

/* Mündlich */
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:10px 12px;border-radius:var(--r);white-space:pre-wrap;font-family:var(--f-text)}
.msg.p{background:var(--bluebg);align-self:flex-start}
.msg.k{background:var(--paper);border:1px solid var(--line);align-self:flex-end}
.msg .who{display:block;font-family:var(--f-ui);font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);margin-bottom:2px}
.list{display:flex;flex-direction:column;gap:8px}
.list .it{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.tbl{overflow-x:auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

 "pruefungen": [{"id": "k1b", "tag": 1, "klausur": 1, "variante": "B", "dauerMin": 120, "titel": "Frau Lindner — die letzten Tage im Seniorenzentrum", "person": "alter Mensch", "setting": "Pflegeheim", "matrix": [{"kb": "I.1", "themen": ["CE 8 UE 3 Begleitung im Sterbeprozess (Blockwoche)", "CE 2b UE 2 Mund- und Zahnpflege", "CE 7 UE 3 Basale Stimulation", "CE 2b UE 5 Atembeobachtung", "CE 2b UE 4 Obstipation und Obstipationsprophylaxe", "CE 5 UE 5 Anatomie und Physiologie Atmung"]}, {"kb": "II.1", "themen": ["CE 3 UE 2 Grundlagen der Kommunikation und Kommunikationsmodelle (Carl Rogers, Friedemann Schulz von Thun, Paul Watzlawick)"]}, {"kb": "I.5", "themen": ["CE 3 UE 2 Grundlagen der Kommunikation und Kommunikationsmodelle (Carl Rogers, Friedemann Schulz von Thun, Paul Watzlawick)"]}, {"kb": "I.6", "themen": ["CE 5 UE 1 Ethische Prinzipien (Medizinethik)"]}, {"kb": "IV", "themen": ["CE 5 UE 7 Betäubungsmittel"]}], "fall": ["Sie sind Auszubildende im zweiten Ausbildungsjahr und haben Frühdienst im Seniorenzentrum St. Anna, Wohnbereich 2. In der Übergabe berichtet die Nachtwache über Frau Margarete Lindner, 86 Jahre. Frau Lindner lebt seit drei Jahren in der Einrichtung. Sie ist katholisch, hat bis ins hohe Alter im Kirchenchor gesungen und liebt Marienlieder. Seit Monaten ist eine fortgeschrittene Krebserkrankung bekannt. Ihr Hausarzt, Dr. Brandt, hat ein Opioid (Morphin) verordnet, das als Betäubungsmittel (BtM) geführt wird — als feste Gabe und zusätzlich als Bedarfsmedikation bei Schmerzen.", "Seit fünf Tagen verlässt Frau Lindner das Bett nicht mehr. Sie ist sehr schläfrig, öffnet auf Ansprache kurz die Augen und schließt sie wieder. Sie isst kaum noch und nimmt nur noch wenige Schlucke Tee zu sich. Sie atmet mit offenem Mund, die Lippen sind rissig, die Zunge ist trocken und belegt. Ihre Oberkieferprothese sitzt locker. Der letzte Stuhlgang war vor fünf Tagen; beim Positionieren verzieht sie das Gesicht, wenn der Bauch berührt wird.", "Im Pflegebericht der Nacht steht: „Atmung seit 3 Uhr verändert: Die Atemzüge werden erst immer tiefer, dann wieder flacher, danach Atempause von ca. 15 Sekunden, dann beginnt es von vorn. AF 11/min.“", "Die Tochter, Sabine Lindner (59), kommt jeden Tag. Sie hält die Hand ihrer Mutter, spielt leise Marienlieder vom Handy ab und cremt ihr die Hände mit der Lavendelcreme ein, die Frau Lindner früher immer benutzt hat. Dann wird Frau Lindner sichtbar ruhiger. Heute hält die Tochter Sie auf dem Flur an und sagt aufgebracht: „Meine Mutter verdurstet doch! Seit Tagen trinkt sie nichts, und keiner sagt mir, was hier los ist. Ich will, dass sie eine Infusion bekommt — und Sie sollen ihr jede Stunde etwas zu trinken geben. Ich kann nicht mehr.“", "Ihr Bruder, Thomas Lindner (62), widerspricht am Telefon: „Mama hat immer gesagt: keine Schläuche, wenn es zu Ende geht. Ich glaube, es gibt eine Patientenverfügung, ich suche sie heraus.“ In der Bewohnerakte liegt keine Patientenverfügung vor. Dr. Brandt kommt um 12 Uhr zur Visite. Ihr Praxisanleiter, Pflegefachmann Herr Petersen, bittet Sie, um 10 Uhr die ärztlich angeordnete Bedarfsdosis des Opioids zu verabreichen, weil Frau Lindner beim Positionieren Schmerzen zeigt."], "aufgaben": [{"nr": "1.1", "operator": "Beschreiben", "afb": "I", "kb": "I.1", "thema": "CE 5 UE 5 Anatomie und Physiologie Atmung", "punkte": 4, "frage": "Beschreiben Sie den Weg der Einatemluft bis zum Ort des Gasaustauschs sowie die Steuerung der Atmung (vier Aspekte).", "erwartung": [{"text": "Weg der Atemluft: Nasenraum → Rachen (Pharynx) → Kehlkopf (Larynx) → Luftröhre (Trachea) → Bronchien → Bronchiolen → Alveolen (Lungenbläschen).", "punkte": 1, "quelle": "Wissen/082-atembeobachtung.md"}, {"text": "Gasaustausch in den Alveolen an der Membran zwischen Alveole und Kapillaren: O₂ geht aus der Alveole ins Blut, CO₂ aus dem Blut in die Alveole und wird ausgeatmet.", "punkte": 1, "quelle": "Wissen/082-atembeobachtung.md"}, {"text": "Atemzentrum in der Medulla oblongata (verlängertes Mark, Übergang Gehirn/Rückenmark) steuert Ein- und Ausatmung, hauptsächlich unbewusst.", "punkte": 1, "quelle": "Wissen/082-atembeobachtung.md"}, {"text": "Spezialisierte Zellen an Arteria carotis, Aorta und nahe dem Rückenmark melden den CO₂-Gehalt des Blutes: je höher der CO₂-Anteil, desto schneller die Atmung.", "punkte": 1, "quelle": "Wissen/082-atembeobachtung.md"}, {"text": "Die Atmung lässt sich bewusst vom Großhirn beeinflussen (z. B. Atem anhalten, bis die veränderte Atemgaszusammensetzung zum Weiteratmen zwingt).", "punkte": 1, "quelle": "Wissen/082-atembeobachtung.md"}, {"text": "Einatmung aktiv: Zwerchfell kontrahiert sich (Kuppel senkt sich), äußere Zwischenrippenmuskeln heben den Brustkorb, Thoraxvolumen nimmt zu.", "punkte": 1, "quelle": "schulung-anatomie-organe/zusammenfassung.html"}], "hinweis": "Je 1 P, max. 4. Zwei Punkte für den Weg/Gasaustausch, zwei für die Steuerung sind ideal; die Atemmechanik (letzte Zeile) wird als gleichwertige Alternative anerkannt. Lungenlappen (rechts drei, links zwei) ebenfalls als Alternative (schulung-anatomie-organe/zusammenfassung.html)."}, {"nr": "1.2", "operator": "Nennen", "afb": "I", "kb": "I.1", "thema": "CE 2b UE 5 Atembeobachtung", "punkte": 6, "frage": "Nennen Sie sechs Kriterien der Atembeobachtung.", "erwartung": [{"text": "Atemtyp (Bauch-, Brust-, Mischatmung)", "punkte": 1, "quelle": "Wissen/083-atembeobachtung-teil-2.md"}, {"text": "Atemfrequenz (Anzahl der Atemzüge pro Minute)", "punkte": 1, "quelle": "Wissen/083-atembeobachtung-teil-2.md"}, {"text": "Atemintensität / Atemtiefe", "punkte": 1, "quelle": "Wissen/083-atembeobachtung-teil-2.md"}, {"text": "Atemrhythmus (Abfolge der Atemzüge)", "punkte": 1, "quelle": "Wissen/083-atembeobachtung-teil-2.md"}, {"text": "Atemgeräusche", "punkte": 1, "quelle": "Wissen/083-atembeobachtung-teil-2.md"}, {"text": "Atemgeruch", "punkte": 1, "quelle": "Wissen/083-atembeobachtung-teil-2.md"}, {"text": "Husten und Sputum", "punkte": 1, "quelle": "Wissen/083-atembeobachtung-teil-2.md"}, {"text": "Hautfarbe, z. B. Zyanose", "punkte": 1, "quelle": "Wissen/083-atembeobachtung-teil-2.md"}, {"text": "Mimik, z. B. Schmerzen beim Atmen", "punkte": 1, "quelle": "Wissen/083-atembeobachtung-teil-2.md"}], "hinweis": "Je 1 P, max. 6. Die sechs fett gedruckten Hauptkriterien des Foliensatzes (Folie 3) sind die erwartete Lösung; die drei weiteren Kriterien werden gleichwertig anerkannt."}, {"nr": "1.3", "operator": "Erklären", "afb": "II", "kb": "I.1", "thema": "CE 2b UE 5 Atembeobachtung", "punkte": 5, "frage": "Erklären Sie das Atemmuster, das die Nachtwache bei Frau Lindner dokumentiert hat (Bezeichnung, Merkmale, Bedeutung in ihrer Situation).", "erwartung": [{"text": "Bezeichnung: Cheyne-Stokes-Atmung.", "punkte": 1, "quelle": "Wissen/083-atembeobachtung-teil-2.md"}, {"text": "Merkmal: periodisch wiederkehrendes An- und Abschwellen der Atemzüge — flache Atemzüge werden immer tiefer und flachen dann wieder ab (im Fall: „erst immer tiefer, dann wieder flacher“).", "punkte": 1, "quelle": "Wissen/083-atembeobachtung-teil-2.md"}, {"text": "Merkmal: dazwischen Atempausen, manchmal länger als 10 Sekunden; danach setzen wieder flache, dann tiefer werdende Atemzüge ein (im Fall: Pause ca. 15 Sekunden).", "punkte": 1, "quelle": "Wissen/083-atembeobachtung-teil-2.md"}, {"text": "Bedeutung: kann bei Sterbenden im präfinalen Stadium beobachtet werden — passt zu Frau Lindners Situation (fortgeschrittene Krebserkrankung, seit Tagen bettlägerig, kaum Nahrung und Flüssigkeit).", "punkte": 1, "quelle": "Wissen/083-atembeobachtung-teil-2.md"}, {"text": "Pathologisch außerdem bei schwerer Schädigung des Atemzentrums und bei Herzerkrankungen infolge der verlangsamten Blutzirkulation; der Schnappatmung, die vor allem kurz vor dem Tod auftritt, geht oft eine Cheyne-Stokes-Atmung voraus.", "punkte": 1, "quelle": "Wissen/083-atembeobachtung-teil-2.md"}], "hinweis": "Erklären verlangt den Bezug zum Fall: Die Merkmale müssen an den Angaben der Nachtwache gezeigt werden. Nur die Bezeichnung ohne Fallbezug: 1 P."}, {"nr": "1.4", "operator": "Erläutern", "afb": "II", "kb": "I.1", "thema": "CE 2b UE 5 Atembeobachtung · CE 5 UE 7 Betäubungsmittel", "punkte": 5, "frage": "Erläutern Sie, warum bei Frau Lindner unter der Opioidtherapie eine gezielte Atembeobachtung erforderlich ist und wie Sie diese durchführen (fünf Aspekte).", "erwartung": [{"text": "Opioide haben eine atemdepressive (die Atmung dämpfende) Wirkung; die Gabe solcher Medikamente ist laut Foliensatz eine Indikation für die gezielte Atembeobachtung (Folie 10 nennt Opioide bei bewusstlosen, beatmeten oder soeben extubierten Pflegeempfängern — Frau Lindner ist stark schläfrig: Übertragung auf den Fall).", "punkte": 1, "quelle": "Wissen/082-atembeobachtung.md"}, {"text": "Bradypnoe = Atemfrequenz beim Erwachsenen unter 12/min; pathologische Ursache u. a. Vergiftungen durch Opiate → die dokumentierte AF von 11/min liegt darunter und muss beachtet werden.", "punkte": 1, "quelle": "Wissen/083-atembeobachtung-teil-2.md"}, {"text": "Atemfrequenz über eine ganze Minute zählen (Normwert Erwachsener 12–18/min).", "punkte": 1, "quelle": "Wissen/083-atembeobachtung-teil-2.md"}, {"text": "Unangekündigt beobachten, da der Mensch seine Atmung beeinflusst, sobald er sich ihrer bewusst wird (z. B. nach der Pulskontrolle das Handgelenk weiter halten).", "punkte": 1, "quelle": "Wissen/083-atembeobachtung-teil-2.md"}, {"text": "Hypoventilation zeigt sich meist als Bradypnoe oder flache Atmung → auch Atemtiefe und -rhythmus beobachten.", "punkte": 1, "quelle": "Wissen/083-atembeobachtung-teil-2.md"}, {"text": "Dokumentation der AF als Verlaufskurve oder Zahl; Besonderheiten und Begleiterscheinungen im Pflegebericht.", "punkte": 1, "quelle": "Wissen/083-atembeobachtung-teil-2.md"}], "hinweis": "Je 1 P, max. 5. Die erste Zeile (atemdepressive Wirkung als Indikation) ist Mindestkriterium. Dass die Beobachtung an die Pflegefachkraft weitergegeben wird, wird anerkannt, ist aber nicht erforderlich. Der Mechanismus „Opioide dämpfen das Atemzentrum“ steht so nicht in den Unterlagen und wird nicht verlangt."}, {"nr": "2.1", "operator": "Nennen", "afb": "I", "kb": "I.1", "thema": "CE 2b UE 2 Mund- und Zahnpflege", "punkte": 4, "frage": "Nennen Sie vier Bereiche, auf die ein gesunder Mundraum Einfluss hat.", "erwartung": [{"text": "Ernährungszustand", "punkte": 1, "quelle": "Wissen/107-mund-und-zahnpflege.md"}, {"text": "Sprechen", "punkte": 1, "quelle": "Wissen/107-mund-und-zahnpflege.md"}, {"text": "Infektionsrisiko und Allgemeinzustand (z. B. Lungenentzündung, Diabetes)", "punkte": 1, "quelle": "Wissen/107-mund-und-zahnpflege.md"}, {"text": "Wohlbefinden, sozialer Status", "punkte": 1, "quelle": "Wissen/107-mund-und-zahnpflege.md"}], "hinweis": "Kernaussage des Foliensatzes: „Mund- und Zahnhygiene fördert die Lebensqualität!“ — als Zusatz willkommen, nicht bepunktet."}, {"nr": "2.2", "operator": "Erarbeiten", "afb": "II", "kb": "I.1", "thema": "CE 2b UE 2 Mund- und Zahnpflege", "punkte": 4, "frage": "Erarbeiten Sie aus der Fallsituation vier Ursachen für die Mundtrockenheit (Xerostomie) von Frau Lindner.", "erwartung": [{"text": "Mundatmung — sie atmet mit offenem Mund.", "punkte": 1, "quelle": "Wissen/100-munderkrankungen.md"}, {"text": "Nebenwirkung von Medikamenten: Opioide gehören zu den Medikamenten, die eine Xerostomie verursachen können.", "punkte": 1, "quelle": "Wissen/032-mundgesundheit-und-medikamente.md"}, {"text": "Flüssigkeitsmangel — sie nimmt nur noch wenige Schlucke Tee zu sich.", "punkte": 1, "quelle": "Wissen/100-munderkrankungen.md"}, {"text": "Nahrungskarenz — sie isst kaum noch.", "punkte": 1, "quelle": "Wissen/100-munderkrankungen.md"}, {"text": "Alter — mit zunehmendem Alter nimmt die Speichelproduktion ab.", "punkte": 1, "quelle": "Wissen/032-mundgesundheit-und-medikamente.md"}], "hinweis": "Je 1 P, max. 4. Jede Ursache muss mit der passenden Angabe aus dem Fall belegt sein; eine Ursache ohne Fallbeleg: 0,5 P."}, {"nr": "2.3", "operator": "Ableiten", "afb": "II", "kb": "I.1", "thema": "CE 2b UE 2 Mund- und Zahnpflege", "punkte": 6, "frage": "Leiten Sie aus der Fallsituation drei Maßnahmen der Mund- und Zahnpflege für Frau Lindner ab.", "erwartung": [{"text": "Maßnahme: Oberkörper aufrecht bzw. erhöht positionieren, Kopf leicht nach vorne, Handtuch unterlegen —", "punkte": 1, "quelle": "Wissen/107-mund-und-zahnpflege.md"}, {"text": "— weil bei der Mundpflege Würgereiz- und Aspirationsgefahr besteht; Frau Lindner ist alt und sehr schläfrig (als besonders gefährdet nennt der Lehrbuchauszug u. a. desorientierte, alte Patienten).", "punkte": 1, "quelle": "Wissen/080-aspirationsprophylaxe.md"}, {"text": "Maßnahme: Mundpflege, die die Mundschleimhaut anfeuchtet; Zunge mitreinigen —", "punkte": 1, "quelle": "Wissen/080-aspirationsprophylaxe.md"}, {"text": "— weil Xerostomie Entzündungen und Infektionen der Mundschleimhaut (z. B. Candidiasis), Aphten/Ulzerationen und Mundgeruch begünstigt und auf der Zunge die meisten Bakterien sitzen (ihre Zunge ist trocken und belegt).", "punkte": 1, "quelle": "Wissen/032-mundgesundheit-und-medikamente.md"}, {"text": "Maßnahme: Oberkieferprothese herausnehmen, mindestens zweimal täglich reinigen (Seife oder Prothesen-Zahnpasta), dabei Fallschutz (Waschlappen oder Wasser im Becken) —", "punkte": 1, "quelle": "Wissen/107-mund-und-zahnpflege.md"}, {"text": "— weil die Prothese ein Keimreservoir ist und fehlender Speichel zu Haftproblemen, Druckstellen und Prothesenstomatitis führt (ihre Prothese sitzt locker).", "punkte": 1, "quelle": "Wissen/032-mundgesundheit-und-medikamente.md"}, {"text": "Maßnahme: Mundschleimhaut und Belag bei jeder Mundpflege beobachten — weil ein grau-weißer Belag, der sich nicht abwischen lässt, auf Soor (Hefepilzinfektion) hinweist.", "punkte": 2, "quelle": "Wissen/100-munderkrankungen.md"}, {"text": "Maßnahme: Mundspülung nur ohne Alkohol, medizinische Lösungen nur auf Arztanordnung — weil Mundspülung das Putzen nicht ersetzt und medizinische Lösungen ärztlich angeordnet werden müssen.", "punkte": 2, "quelle": "Wissen/107-mund-und-zahnpflege.md"}], "hinweis": "Je Maßnahme 1 P + 1 P für die fallbezogene Begründung, max. 6 (drei Maßnahmen). Eine Maßnahme ohne Begründung: 1 P. Die Paare „Maßnahme — weil …“ gehören zusammen."}, {"nr": "2.4", "operator": "Erläutern", "afb": "II", "kb": "I.1", "thema": "CE 7 UE 3 Basale Stimulation", "punkte": 5, "frage": "Erläutern Sie an der Fallsituation, wie die Tochter mit Elementen der basalen Stimulation in die Begleitung ihrer Mutter einbezogen werden kann.", "erwartung": [{"text": "Basale Stimulation = Förderung und Stimulierung der Sinne → Förderung der Ressourcen, d. h. der Wahrnehmung, die Frau Lindner noch hat.", "punkte": 1, "quelle": "Wissen/020-srw-syndrom-der-reaktionslosen-wachheit-tafelbild.md"}, {"text": "Musik: Die eingesetzten Mittel aktivieren Wahrnehmung und Sinne über Gerüche, Musik und Berührungen — im Fall die Marienlieder, die die Tochter leise abspielt.", "punkte": 1, "quelle": "Wissen/020-srw-syndrom-der-reaktionslosen-wachheit-tafelbild.md"}, {"text": "Berührung: Hand halten, Hände eincremen — Förderung der Wahrnehmung durch Berührung.", "punkte": 1, "quelle": "Wissen/068-die-rasur.md"}, {"text": "Geruch: die vertraute Lavendelcreme — Förderung der Wahrnehmung durch Gerüche; CAVE Allergien beachten.", "punkte": 1, "quelle": "Wissen/068-die-rasur.md"}, {"text": "Angehörige von Anfang an einbeziehen — die Tochter kennt Vorlieben und Gewohnheiten; der Fall zeigt die Wirkung: Frau Lindner wird sichtbar ruhiger.", "punkte": 1, "quelle": "Wissen/020-srw-syndrom-der-reaktionslosen-wachheit-tafelbild.md"}], "hinweis": "Die Unterlagen behandeln basale Stimulation am Syndrom der reaktionslosen Wachheit und bei der Rasur; die Übertragung auf die Sterbephase ist die verlangte Transferleistung. Leise Musik und Vorlesen in der Sterbephase (schulung-interkulturelle-pflege/zusammenfassung.html) werden als Beleg anerkannt."}, {"nr": "3.1", "operator": "Nennen", "afb": "I", "kb": "I.1", "thema": "CE 2b UE 4 Obstipation und Obstipationsprophylaxe", "punkte": 5, "frage": "Nennen Sie die Definition der Obstipation sowie je zwei funktionelle und zwei habituelle Ursachen.", "erwartung": [{"text": "Definition: Obstipation ist ein Symptom; weniger als drei Ausscheidungen (Stuhlgänge) pro Woche.", "punkte": 1, "quelle": "Wissen/034-obstipation.md"}, {"text": "Funktionelle Ursachen (zwei davon): Stenosen, Tumore, hormonelle Störung (z. B. Hypothyreose), Nebenwirkungen von Medikamenten (z. B. BTM/Betäubungsmittel), Lähmungen des Darms.", "punkte": 2, "quelle": "Wissen/034-obstipation.md"}, {"text": "Habituelle Ursachen (zwei davon): Stress, Bewegungsmangel, Adipositas, verminderte Nahrungsaufnahme, niedriger Flüssigkeitshaushalt, ungewohnte Umgebung.", "punkte": 2, "quelle": "Wissen/034-obstipation.md"}], "hinweis": "Je richtig zugeordnete Ursache 1 P. Falsche Zuordnung funktionell/habituell: 0 P für diese Ursache."}, {"nr": "3.2", "operator": "Ableiten", "afb": "II", "kb": "I.1", "thema": "CE 2b UE 4 Obstipation und Obstipationsprophylaxe", "punkte": 5, "frage": "Leiten Sie aus den Maßnahmen der Obstipationsprophylaxe drei ab, die für Frau Lindner in ihrer jetzigen Situation geeignet sind.", "erwartung": [{"text": "Kolonmassage nach Vogler: angenehmer Druck entlang des Dickdarms, ca. 5 Minuten, am besten morgens — regt die Peristaltik an, ohne dass Frau Lindner selbst aktiv werden muss; nur solange sie es toleriert (Mimik beobachten, sie verzieht bei Bauchberührung das Gesicht).", "punkte": 1, "quelle": "Wissen/034-obstipation.md"}, {"text": "Intimsphäre wahren, Stuhlgang in geschütztem Raum ermöglichen, Besuch so lange hinausbitten, durch Haltung und Gespräch das Schamgefühl nehmen.", "punkte": 1, "quelle": "Wissen/034-obstipation.md"}, {"text": "Flüssigkeit in kleinen Mengen anbieten, ohne festgelegte Trinkmenge — weil in der Sterbephase festgelegte Trinkmengen neu definiert werden können und das Bedürfnis nach Ruhe oberste Priorität hat.", "punkte": 1, "quelle": "Wissen/063-pemu-erfassung-mangelernaehrung.md"}, {"text": "Positionswechsel im Rahmen der ohnehin nötigen Positionierung nutzen (regelmäßiger Wechsel der Körperhaltung, Ressourcen nutzen) statt Mobilisationsprogramm — weil Ruhe und Passivität Vorrang haben.", "punkte": 1, "quelle": "Wissen/034-obstipation.md"}, {"text": "Abgrenzung (Begründung, warum eine Standardmaßnahme nicht passt): Ballaststoffreiche Kost (35–40 g/Tag) setzt ausreichend Flüssigkeit voraus — Ballaststoffaufnahme ohne zureichenden Wasserkonsum ist selbst eine Ursache der Obstipation; Frau Lindner trinkt kaum.", "punkte": 1, "quelle": "Wissen/034-obstipation.md"}, {"text": "Abgrenzung: Klistier/Klysma hat Kontraindikationen und kann zu Kreislaufbelastung führen (Vitalzeichenkontrolle) — für eine sterbende Bewohnerin belastend; die Abwägung im Team und mit dem Arzt ist Folgerung, nicht Wortlaut der Unterlagen.", "punkte": 1, "quelle": "Wissen/034-obstipation.md"}, {"text": "Beobachtung: Bei „Durchfall“ eines opioidbehandelten, immobilen Menschen zuerst an eine Überlauf-Situation (Kotstauung, flüssiger Stuhl läuft vorbei) denken — nicht stopfend behandeln.", "punkte": 1, "quelle": "schulung-kontinenz/zusammenfassung.html"}], "hinweis": "Je 1 P, max. 5: drei geeignete Maßnahmen mit Begründung (3 P) + 2 P für Begründungen, die die Sterbephase/Ruhebedürfnis oder eine begründete Abgrenzung einbeziehen. Bewegungsübungen wie „Fahrrad fahren“ im Bett oder Bettfahrrad ohne Abwägung: 0 P."}, {"nr": "3.3", "operator": "Erläutern", "afb": "II", "kb": "IV", "thema": "CE 5 UE 7 Betäubungsmittel", "punkte": 6, "frage": "Erläutern Sie anhand der drei Verantwortungsebenen der Delegation, was für Herrn Petersen und für Sie gilt, wenn er Ihnen die Gabe der ärztlich angeordneten Bedarfsdosis des Opioids überträgt — einschließlich der Beobachtung nach der Gabe (sechs Aspekte).", "erwartung": [{"text": "Anordnungsverantwortung trägt, wer delegiert (hier Herr Petersen; die ärztliche Anordnung kommt von Dr. Brandt).", "punkte": 1, "quelle": "schulung-recht/zusammenfassung.html"}, {"text": "Inhalt der Anordnungsverantwortung: Auswahl (Ist die Person geeignet?), Anleitung (Wurde sie eingewiesen?), Überwachung (Wird kontrolliert?).", "punkte": 1, "quelle": "schulung-recht/zusammenfassung.html"}, {"text": "Übernahmeverantwortung trage ich als Person, die die Aufgabe annimmt: Ich prüfe „Kann ich das? Darf ich das? Bin ich eingewiesen?“", "punkte": 1, "quelle": "schulung-recht/zusammenfassung.html"}, {"text": "Wenn nein, muss ich die Aufgabe ablehnen (Beispiel Anna im Einstiegsfall: ohne Einweisung hätte sie ablehnen müssen).", "punkte": 1, "quelle": "schulung-recht/zusammenfassung.html"}, {"text": "Durchführungsverantwortung: Wer die Aufgabe ausführt, ist für die sorgfältige, richtige Durchführung verantwortlich.", "punkte": 1, "quelle": "schulung-recht/zusammenfassung.html"}, {"text": "Nach der Gabe beobachten: Atmung (atemdepressive Wirkung, Bradypnoe) und Ausscheidung (BTM/Opiate verursachen als Nebenwirkung Obstipation; Opioide wirken auch auf die Blase, Harnverhalt).", "punkte": 1, "quelle": "Wissen/082-atembeobachtung.md · Wissen/034-obstipation.md · Wissen/090-risikofaktoren-inkontinenz.md"}], "hinweis": "Die Unterlagen enthalten keine Regeln des Betäubungsmittelrechts (BtM-Dokumentation, Aufbewahrung, Entsorgung, Doppelkontrolle). Diese werden hier nicht bepunktet. Wer die Doppelkontrolle bei Hochrisiko-Medikamenten nennt (Übungsfall Jana, schulung-recht/zusammenfassung.html), erhält keinen Abzug."}, {"nr": "4.1", "operator": "Nennen", "afb": "I", "kb": "II.1", "thema": "CE 3 UE 2 Grundlagen der Kommunikation — Schulz von Thun", "punkte": 4, "frage": "Nennen Sie die vier Seiten einer Nachricht nach Friedemann Schulz von Thun.", "erwartung": [{"text": "Sachinhalt", "punkte": 1, "quelle": "schulung-kommunikation/zusammenfassung.html"}, {"text": "Selbstkundgabe (Selbstoffenbarung)", "punkte": 1, "quelle": "schulung-kommunikation/zusammenfassung.html"}, {"text": "Beziehungshinweis (Beziehungsebene)", "punkte": 1, "quelle": "schulung-kommunikation/zusammenfassung.html"}, {"text": "Appell", "punkte": 1, "quelle": "schulung-kommunikation/zusammenfassung.html"}]}, {"nr": "4.2", "operator": "Nennen", "afb": "I", "kb": "II.1", "thema": "CE 3 UE 2 Grundlagen der Kommunikation — Watzlawick", "punkte": 3, "frage": "Nennen Sie drei der fünf Axiome nach Paul Watzlawick.", "erwartung": [{"text": "Man kann nicht nicht kommunizieren.", "punkte": 1, "quelle": "schulung-kommunikation/zusammenfassung.html"}, {"text": "Jede Kommunikation hat einen Inhalts- und einen Beziehungsaspekt.", "punkte": 1, "quelle": "schulung-kommunikation/zusammenfassung.html"}, {"text": "Kommunikation als kreisförmiger Prozess.", "punkte": 1, "quelle": "schulung-kommunikation/zusammenfassung.html"}, {"text": "Analoge und digitale Kommunikation.", "punkte": 1, "quelle": "schulung-kommunikation/zusammenfassung.html"}, {"text": "Symmetrische und komplementäre Beziehungen.", "punkte": 1, "quelle": "schulung-kommunikation/zusammenfassung.html"}], "hinweis": "Je 1 P, max. 3. In den Unterlagen stehen nur die Namen der Axiome; der Inhalt (Pflege Heute 39.2.1) liegt nicht vor und wird deshalb nicht abgefragt."}, {"nr": "4.3", "operator": "Erläutern", "afb": "II", "kb": "II.1", "thema": "CE 3 UE 2 Grundlagen der Kommunikation — Schulz von Thun", "punkte": 4, "frage": "Erläutern Sie die Äußerung der Tochter auf dem Flur mithilfe der vier Seiten einer Nachricht.", "erwartung": [{"text": "Sachinhalt: Daten und Fakten — „Seit Tagen trinkt sie nichts“; sie wünscht eine Infusion.", "punkte": 1, "quelle": "schulung-kommunikation/zusammenfassung.html"}, {"text": "Selbstkundgabe: Was sie von sich zu erkennen gibt — Verzweiflung, Überforderung, Angst um die Mutter („Ich kann nicht mehr“; vgl. Folienbeispiel „Ich habe Schmerzen“ → „Ich kann nicht mehr“).", "punkte": 1, "quelle": "schulung-kommunikation/zusammenfassung.html"}, {"text": "Beziehungshinweis: Was sie von der Pflege hält, wie sie zu ihr steht — sie fühlt sich nicht informiert, Vorwurf („keiner sagt mir, was hier los ist“).", "punkte": 1, "quelle": "schulung-kommunikation/zusammenfassung.html"}, {"text": "Appell: Was sie erreichen möchte — „Tun Sie etwas! Informieren Sie mich!“ (offen: Infusion, stündlich zu trinken geben).", "punkte": 1, "quelle": "schulung-kommunikation/zusammenfassung.html"}], "hinweis": "Erläutern verlangt den Beleg am Zitat. Fachlich richtige, anders formulierte Deutungen je Seite werden anerkannt; maßgeblich ist die richtige Zuordnung zur Seite."}, {"nr": "4.4", "operator": "Entwickeln", "afb": "III", "kb": "I.5", "thema": "CE 3 UE 2 Grundlagen der Kommunikation — Carl Rogers", "punkte": 6, "frage": "Entwickeln Sie ein begründetes Gesprächsangebot an die Tochter, das die drei Grundhaltungen nach Carl Rogers und Techniken des aktiven Zuhörens umsetzt.", "erwartung": [{"text": "Kongruenz (Echtheit): Ich-Botschaft, das Gesagte stimmt mit dem Empfinden überein — nicht alles sagen, aber nichts sagen, was nicht stimmt; keine „professionelle Maske“ (z. B. „Ich merke, wie sehr Sie das belastet, und ich möchte mir Zeit für Sie nehmen.“).", "punkte": 1, "quelle": "schulung-kommunikation/zusammenfassung.html"}, {"text": "Akzeptanz: nicht an Bedingungen geknüpfte Wertschätzung, nicht werten; Abgrenzung von Person und Verhalten — ihren Vorwurf nicht zurückweisen, Verständnis äußern, ohne der Forderung automatisch zuzustimmen.", "punkte": 1, "quelle": "schulung-kommunikation/zusammenfassung.html"}, {"text": "Empathie: einfühlendes Verstehen — die hinter der Aussage stehende gefühlte Bedeutung aussprechen (z. B. „Sie haben Angst, dass Ihre Mutter leidet.“).", "punkte": 1, "quelle": "schulung-kommunikation/zusammenfassung.html"}, {"text": "Aktives Zuhören, Techniken: Türöffner („Möchten Sie darüber reden?“), Paraphrasieren (Kernaussage mit eigenen Worten wiedergeben), Spiegeln/Verbalisieren von Gefühlen, Unklarheiten klären.", "punkte": 1, "quelle": "schulung-kommunikation/zusammenfassung.html"}, {"text": "Rahmen: bewusst zuhören, Nebentätigkeiten ruhen lassen, zugewandte, offene Körpersprache, Blickkontakt, eigene Meinung, Urteile und Ratschläge zurückhalten.", "punkte": 1, "quelle": "schulung-kommunikation/zusammenfassung.html"}, {"text": "Begründung: Rogers fragt nach den Bedingungen, unter denen ein Mensch von sich aus über sein Erleben spricht; „Verstehen geht vor Handeln“ — erst wenn verstanden ist, was die Tochter braucht, kann sie in die Pflege einbezogen werden (z. B. Angebot eines gemeinsamen Gesprächs mit Dr. Brandt).", "punkte": 1, "quelle": "schulung-kommunikation/zusammenfassung.html"}], "hinweis": "Entwickeln (AFB III): Es wird ein zusammenhängendes, fallbezogenes Gesprächsangebot erwartet, keine Begriffsliste. Grundhaltungen nur genannt ohne Umsetzung im Fall: je 0,5 P. Das konkrete Angebot eines Arztgesprächs ist Transfer und wird als Teil der Begründung anerkannt."}, {"nr": "5.1", "operator": "Nennen", "afb": "I", "kb": "I.6", "thema": "CE 5 UE 1 Ethische Prinzipien (Medizinethik)", "punkte": 4, "frage": "Nennen Sie die vier ethischen Prinzipien der Medizinethik.", "erwartung": [{"text": "Autonomie", "punkte": 1, "quelle": "schulung-kommunikation/zusammenfassung.html"}, {"text": "Fürsorge", "punkte": 1, "quelle": "schulung-kommunikation/zusammenfassung.html"}, {"text": "Gerechtigkeit", "punkte": 1, "quelle": "schulung-kommunikation/zusammenfassung.html"}, {"text": "Nicht-Schaden", "punkte": 1, "quelle": "schulung-kommunikation/zusammenfassung.html"}], "hinweis": "Die vier Prinzipien stehen in der Musterlösung der Dozentin zum Fall Herr Möller (Phase 4). Definitionen der Prinzipien liegen in den Unterlagen nicht vor und werden nicht verlangt."}, {"nr": "5.2", "operator": "Beurteilen", "afb": "III", "kb": "I.6", "thema": "CE 5 UE 1 Ethische Prinzipien (Medizinethik)", "punkte": 12, "frage": "Beurteilen Sie die Forderung der Tochter (Infusion, stündliches Trinken) mithilfe des dialogischen Modells nach Heffels (sieben Phasen) bis hin zu einer begründeten Handlungsempfehlung.", "erwartung": [{"text": "Phase 1 Situationsdeutung — Was liegt vor? Sterbende Bewohnerin trinkt kaum; Forderung nach Infusion. Wer ist beteiligt? Frau Lindner, Tochter, Sohn, Dr. Brandt, Pflegeteam/Auszubildende.", "punkte": 1, "quelle": "schulung-verantwortung/zusammenfassung.html"}, {"text": "Phase 1 — Wer hat welche Ansicht? Tochter: Angst, die Mutter „verdurstet“ (Fürsorge); Sohn: früher geäußerter Wille „keine Schläuche“; Frau Lindner selbst kann sich nicht mehr äußern; Pflege: will Wohlbefinden und Würde wahren.", "punkte": 1, "quelle": "schulung-kommunikation/zusammenfassung.html"}, {"text": "Phase 2 Problembestimmung: Es kollidieren Autonomie/Selbstbestimmung (früher geäußerter Wille) und Nicht-Schaden mit der Fürsorge der Tochter — zwei Werte, die beide gut gemeint sind.", "punkte": 2, "quelle": "schulung-kommunikation/zusammenfassung.html"}, {"text": "Phase 3 Zielbestimmung: Worum geht es im Kern? Wohlbefinden von Frau Lindner, vertrauensvolle Beziehung zwischen Familie, Arzt und Pflege.", "punkte": 1, "quelle": "schulung-kommunikation/zusammenfassung.html"}, {"text": "Phase 4 Vorgaben: ethische Prinzipien; Pflege-Charta (Recht auf Selbstbestimmung); Leitfaden PEMU: Autonomie und Selbstbestimmung berücksichtigen, Bedürfnis nach Ruhe und Passivität hat oberste Priorität, in der Sterbephase können festgelegte Trinkmengen neu definiert und auf Gewichtserfassung verzichtet werden.", "punkte": 1, "quelle": "Wissen/063-pemu-erfassung-mangelernaehrung.md · Wissen/023-prinzipien-der-koerperpflege.md"}, {"text": "Phase 4 Recht: Ein Heileingriff ist immer eine Körperverletzung und erst durch Einwilligung gerechtfertigt; eine mutmaßliche Einwilligung ist nicht anzuwenden, wenn ein rechtswirksam entgegenstehender Wille (z. B. Patientenverfügung) bekannt ist → Patientenverfügung klären.", "punkte": 1, "quelle": "schulung-recht/zusammenfassung.html"}, {"text": "Phase 5 Handlungsmöglichkeiten — auch die schlechten sammeln: Infusion ohne Diskussion; stündlich Flüssigkeit einflößen; nichts tun; gemeinsames Gespräch mit Arzt, Tochter und Sohn; Patientenverfügung suchen; Gespräch im Team; Mundpflege zur Befeuchtung statt Trinkmenge.", "punkte": 2, "quelle": "schulung-kommunikation/zusammenfassung.html"}, {"text": "Phase 6 Entscheidungsfindung (höchste Wirkung, geringste Nebenwirkungen): gemeinsames Gespräch mit Dr. Brandt, Tochter und Sohn bei der Visite; Willen von Frau Lindner klären (Patientenverfügung); Trinkmenge nach PEMU-Leitfaden neu festlegen; Flüssigkeit nur anbieten, nicht einflößen; regelmäßige Mundpflege; Dokumentation und Rücksprache mit dem Arzt.", "punkte": 2, "quelle": "schulung-kommunikation/zusammenfassung.html · Wissen/063-pemu-erfassung-mangelernaehrung.md"}, {"text": "Phase 7 Evaluieren (als Fragen): Wirkt Frau Lindner ruhig und entspannt (Mimik, Atmung)? Fühlt sich die Tochter einbezogen und informiert? Wie ist das Vertrauensverhältnis nach dem Gespräch?", "punkte": 1, "quelle": "schulung-kommunikation/zusammenfassung.html"}], "hinweis": "Beurteilen: erst Einschätzung, dann Begründung entlang der Phasen, dann Empfehlung. Die Empfehlung darf weder „Infusion“ noch „nichts tun“ ohne Abwägung sein; gesucht ist der „dritte Weg“ wie in der Musterlösung Herr Möller. Fehlt Phase 5 mit Alternativen, max. 9 P. Medizinische Aussagen über Nutzen oder Schaden einer Infusion in der Sterbephase stehen nicht in den Unterlagen und werden nicht verlangt."}, {"nr": "6.1", "operator": "Entwickeln", "afb": "III", "kb": "I.1", "thema": "CE 8 UE 3 Begleitung im Sterbeprozess (Blockwoche)", "punkte": 12, "frage": "Entwickeln Sie einen begründeten Begleitplan für die letzten Lebenstage von Frau Lindner, der die Bewohnerin, ihre Angehörigen und ihre religiöse Prägung berücksichtigt.", "erwartung": [{"text": "Sterbephase (christlich): ruhige Körperpflege, Schweigen, leise Musik, Vorlesen — passend zu ihrer Biografie (Kirchenchor, Marienlieder).", "punkte": 2, "quelle": "schulung-interkulturelle-pflege/zusammenfassung.html"}, {"text": "Priester frühzeitig informieren (nach Wunsch der Familie): Krankensalbung für Katholiken bei schwerer Krankheit — zwecks Sündenvergebung und ewigem Leben; Salbung mit geweihtem Öl an den fünf Sinnen.", "punkte": 1, "quelle": "schulung-interkulturelle-pflege/zusammenfassung.html"}, {"text": "Gegebenenfalls religiöse Rituale und Raumgestaltung nach Wunsch: Fenster öffnen („Seelenfenster“), Tisch mit weißer Tischdecke, Kreuz, zwei Kerzen, kleine Schale mit Weihwasser.", "punkte": 1, "quelle": "schulung-interkulturelle-pflege/zusammenfassung.html"}, {"text": "Ernährung und Flüssigkeit: Ruhe und Passivität haben oberste Priorität; auf Gewichtserfassung verzichten, festgelegte Trinkmengen neu definieren.", "punkte": 2, "quelle": "Wissen/063-pemu-erfassung-mangelernaehrung.md"}, {"text": "Phase 6 nach Schaeffer und Moers (Abwärtsentwicklung und Sterben): Die Erkrankten sind fast vollständig auf die Unterstützung anderer verwiesen; besonders schwer ist es zu ertragen, dass andere stellvertretend handeln → Gewohnheiten und Wünsche (Lavendelcreme, Musik) weiter berücksichtigen.", "punkte": 2, "quelle": "schulung-rehabilitation/zusammenfassung.html"}, {"text": "Angehörige: Ist die Hilfesituation unsicher, weil Angehörige selbst überfordert sind, wird eine protektive Versorgung gewünscht, die allen Beteiligten Sicherheit bietet → Tochter und Sohn informieren, einbeziehen (basale Stimulation), Gesprächsangebote.", "punkte": 2, "quelle": "schulung-rehabilitation/zusammenfassung.html · Wissen/020-srw-syndrom-der-reaktionslosen-wachheit-tafelbild.md"}, {"text": "Beobachtung und Dokumentation der Atmung: Cheyne-Stokes-Atmung kann bei Sterbenden im präfinalen Stadium auftreten; Schnappatmung tritt vor allem kurz vor dem Tod auf.", "punkte": 1, "quelle": "Wissen/083-atembeobachtung-teil-2.md"}, {"text": "Gefühlsarbeit: Trostarbeit und Fassungsarbeit — Fassungsarbeit findet nicht ausschließlich verbal statt (Dasein, Hand halten), wie im Fall Frau Los.", "punkte": 1, "quelle": "schulung-kommunikation/zusammenfassung.html"}, {"text": "Nach dem Tod (Alternative): Kondolenzbuch, Foto mit schwarzem Rahmen und Kerzen, Nachttisch mit Kerze und Kreuz, Abschiedsfeier.", "punkte": 1, "quelle": "schulung-interkulturelle-pflege/zusammenfassung.html"}], "hinweis": "Je Element 1 P bzw. 2 P bei begründeter Ausführung, max. 12. AFB III: Jedes Element braucht eine Begründung (weil …); ohne Begründung höchstens die Hälfte. Das Element „nach dem Tod“ ist eine gleichwertige Alternative, falls ein anderes fehlt. Religiöse Elemente nur als Angebot nach Wunsch von Bewohnerin/Familie — als Pflicht formuliert: Abzug 1 P."}], "gesamtpunkte": 100, "quellen": ["Wissen/020-srw-syndrom-der-reaktionslosen-wachheit-tafelbild.md", "Wissen/023-prinzipien-der-koerperpflege.md", "Wissen/032-mundgesundheit-und-medikamente.md", "Wissen/034-obstipation.md", "Wissen/063-pemu-erfassung-mangelernaehrung.md", "Wissen/068-die-rasur.md", "Wissen/080-aspirationsprophylaxe.md", "Wissen/082-atembeobachtung.md", "Wissen/083-atembeobachtung-teil-2.md", "Wissen/090-risikofaktoren-inkontinenz.md", "Wissen/100-munderkrankungen.md", "Wissen/107-mund-und-zahnpflege.md", "examen-abschluss/examen.html", "ressources/klausur-konventionen.md", "schulung-anatomie-organe/zusammenfassung.html", "schulung-interkulturelle-pflege/zusammenfassung.html", "schulung-kommunikation/zusammenfassung.html", "schulung-kontinenz/zusammenfassung.html", "schulung-recht/zusammenfassung.html", "schulung-rehabilitation/zusammenfassung.html", "schulung-verantwortung/zusammenfassung.html"], "luecken": ["CE 8 UE 3 Begleitung im Sterbeprozess (Blockwoche) : aucun support de cours propre dans le dépôt. Seuls des fragments existent (rituels chrétiens de la phase terminale dans « Interkulturelle Pflege », Cheyne-Stokes/Schnappatmung, phrase PEMU sur la phase terminale, phase 6 de Schaeffer/Moers). Pas de phases du deuil/de l'agonie, pas de soins palliatifs des symptômes (douleur, angoisse, râles, soins de bouche spécifiques en fin de vie).", "CE 7 UE 3 Basale Stimulation : seulement le Tafelbild SRW (Gerüche → Musik → Berührungen, Angehörige einbeziehen) et la diapo sur le rasage. Le concept complet (Initialberührung, formes somatique/vestibulaire/vibratoire, auteurs) manque ; l'« Initialberührung » du Lernmaterial est marquée [Ergänzung] et n'a pas été utilisée.", "CE 5 UE 7 Betäubungsmittel : quasiment rien. Aucune règle du droit des stupéfiants (BtMG/BtMVV, BtM-Buch, stockage, double contrôle, destruction). Présent seulement : BTM/opiacés → constipation, opioïdes → dépression respiratoire, xérostomie, rétention urinaire. L'Aufgabe 3.3 teste donc la délégation (cours de droit) + l'observation, pas le droit des stupéfiants.", "CE 5 UE 1 Ethische Prinzipien : les quatre principes ne sont que nommés (Musterlösung Herr Möller). Le cours de Mme Nix (CE 1 UE 6 : ICN-Kodex, Pflege-Charta, définitions des principes) n'est pas dans le dépôt → seulement « Nennen » + application avec le modèle de Heffels.", "CE 5 UE 5 Anatomie und Physiologie Atmung : le cours CE 5 UE 5 lui-même n'est pas dans le dépôt. Contenu pris de « Atembeobachtung Teil 1 » (CE 2 UE 5) et de la page Organes (affiche Lunge CE 05 UE 0, muscles inspiratoires).", "CE 3 UE 2 Watzlawick : les cinq axiomes ne sont que nommés (contenu dans Pflege Heute 39.2.1, absent) → seulement « Nennen ». Les « gesprächshemmende Faktoren » manquent aussi.", "Mund- und Zahnpflege bei Sterbenden : aucune consigne spécifique (soins des lèvres, humidification en fin de vie). Seulement principes généraux, Xerostomie et Aspirationsprophylaxe (« Mundhygiene, um Mundschleimhaut anzufeuchten »).", "Obstipation unter Opioiden : le lien BTM → constipation existe, mais aucune prophylaxie laxative médicamenteuse spécifique aux opioïdes n'est dans ses documents."], "fiktiv": ["Tous les noms : Frau Margarete Lindner, Sabine Lindner, Thomas Lindner, Dr. Brandt, Herr Petersen, « Seniorenzentrum St. Anna ».", "Âges (86, 59, 62 ans), durée de séjour (3 ans), chorale, Marienlieder, crème à la lavande.", "Diagnostic « fortgeschrittene Krebserkrankung » et prescription de morphine (fixe + à la demande) — détails du cas, sans dose.", "Valeurs et observations : 5 jours alitée, dernier Stuhlgang il y a 5 jours, pause respiratoire 15 s, AF 11/min, prothèse supérieure qui bouge.", "Les citations de la fille et du fils, l'existence possible d'une Patientenverfügung, l'heure de visite 12 h et l'heure de la Bedarfsdosis 10 h."]}, {"id": "probe", "probe": true, "tag": 0, "klausur": 0, "variante": "Probe", "dauerMin": 15, "titel": "Probelauf: Atembeobachtung bei Frau Berger", "person": "alter Mensch", "setting": "Pflegeheim", "matrix": [{"kb": "I.1", "themen": ["CE 2b UE 5 Atembeobachtung", "CE 5 UE 5 Anatomie und Physiologie Atmung"]}], "fall": ["Frau Berger ist 84 Jahre alt und lebt seit zwei Jahren im Pflegeheim. Sie hat eine Herzerkrankung. Seit gestern bekommt sie gegen starke Schmerzen ein Opioid.", "Heute Morgen ist sie sehr schläfrig und kaum ansprechbar. Ihre Tochter sagt bei der Übergabe: „Mama atmet so langsam. Ist das normal?“ Ihre Praxisanleiterin bittet Sie, Frau Berger heute genau zu beobachten."], "aufgaben": [{"nr": "1", "operator": "Nennen", "afb": "I", "kb": "I.1", "thema": "CE 5 UE 5 Anatomie und Physiologie Atmung", "punkte": 3, "frage": "Nennen Sie die drei Faktoren, die für den Gasaustausch erforderlich sind.", "erwartung": [{"text": "Belüftung der Lunge (Ventilation)", "punkte": 1, "quelle": "Wissen/082-atembeobachtung.md (Folie 6)"}, {"text": "Durchblutung der Lunge (Perfusion)", "punkte": 1, "quelle": "Wissen/082-atembeobachtung.md (Folie 6)"}, {"text": "Transport von O₂ und CO₂", "punkte": 1, "quelle": "Wissen/082-atembeobachtung.md (Folie 6)"}]}, {"nr": "2", "operator": "Erklären", "afb": "II", "kb": "I.1", "thema": "CE 5 UE 5 Anatomie und Physiologie Atmung", "punkte": 4, "frage": "Erklären Sie, wie die Atmung gesteuert wird und wodurch der Atemantrieb stärker wird. Nennen Sie dabei zwei Auslöser.", "erwartung": [{"text": "Unbewusste Steuerung durch das Atemzentrum in der Medulla oblongata (verlängertes Mark); bewusst über das Großhirn beeinflussbar", "punkte": 1, "quelle": "Wissen/082-atembeobachtung.md (Folien 3 und 8)"}, {"text": "Zellen an der Halsschlagader (A. carotis), an der Aorta und nahe dem Rückenmark melden den CO₂-Gehalt des Blutes: je höher, desto schneller die Atmung", "punkte": 1, "quelle": "Wissen/082-atembeobachtung.md (Folie 3)"}, {"text": "Auslöser: sinkender Sauerstoffgehalt (z. B. im Gebirge) oder steigender Kohlendioxidgehalt", "punkte": 1, "quelle": "Wissen/082-atembeobachtung.md (Folie 9)"}, {"text": "Auslöser: sinkender pH-Wert / Übersäuerung (z. B. Azidose bei diabetischem Koma)", "punkte": 1, "quelle": "Wissen/082-atembeobachtung.md (Folie 9)"}], "hinweis": "Zwei beliebige richtige Auslöser aus Folie 9 geben zusammen 2 Punkte."}, {"nr": "3", "operator": "Begründen", "afb": "III", "kb": "I.1", "thema": "CE 2b UE 5 Atembeobachtung", "punkte": 3, "frage": "Begründen Sie mit zwei Argumenten aus dem Fall, warum bei Frau Berger eine gezielte Atembeobachtung erforderlich ist.", "erwartung": [{"text": "Sie bekommt ein Opioid; Opioide wirken atemdepressiv (dämpfen die Atmung) → Atembeobachtung erforderlich", "punkte": 1, "quelle": "Wissen/082-atembeobachtung.md (Folie 10)"}, {"text": "Sie hat eine Herzerkrankung → gezielte Atembeobachtung mindestens einmal pro Dienst", "punkte": 1, "quelle": "Wissen/082-atembeobachtung.md (Folie 10)"}, {"text": "Begründung als Kette mit weil/deshalb und Bezug zu den Beobachtungen im Fall (schläfrig, langsame Atmung laut Tochter)", "punkte": 1, "quelle": "Operator Begründen: ressources/klausur-konventionen.md (Etude-Repo)"}]}], "gesamtpunkte": 10, "quellen": ["Etude-Repo: Wissen/082-atembeobachtung.md (aus PDFs/83-atembeobachtung-teil-1.pdf, I. Himmel 2025)", "Etude-Repo: ressources/klausur-konventionen.md"], "luecken": [], "fiktiv": ["Frau Berger, ihr Alter, ihre Tochter und die Situation sind für die Übung erfunden."]}], "muendlich": [{"id": "m1", "titel": "Frau Kessler — Schub, Schweigepflicht und die eigene Rolle", "person": "Erwachsene, 41 Jahre, Multiple Sklerose (RRMS)", "setting": "Krankenhaus, neurologische Station", "kb": ["III", "IV", "V"], "fall": ["Sie sind im dritten Ausbildungsjahr und im Einsatz auf der neurologischen Station eines Krankenhauses. Frau Nadine Kessler, 41 Jahre, ist Erzieherin in einer Kita, verheiratet und hat zwei Kinder (8 und 11 Jahre). Seit sechs Jahren lebt sie mit einer schubförmig verlaufenden Multiplen Sklerose (RRMS). Gestern wurde sie mit einem neuen Schub aufgenommen: Sie sieht auf dem linken Auge „wie durch einen Schleier“, stolpert beim Gehen und ist seit Tagen extrem erschöpft. Der Stationsarzt hat eine hochdosierte Cortisontherapie über fünf Tage angeordnet.", "Bei der Aufnahme sagt Frau Kessler: „Die Spritzen habe ich vor vier Monaten weggelassen. Danach hatte ich immer ein Grippegefühl, und trotzdem kam der nächste Schub. Ich habe alles gemacht, was die Ärzte gesagt haben — wozu also?“ Seitdem heißt es in der Übergabe: „Frau Kessler ist unkooperativ, Non-Compliance.“ Eine Kollegin ergänzt: „Die liegt ja nur im Bett. Die ist einfach faul — das kennt man doch.“", "In der Visite um 11 Uhr legt der Stationsarzt die Cortisongabe für heute auf 20 Uhr, „weil es organisatorisch besser passt“. Sie wundern sich darüber, sagen aber nichts; die Visite geht schnell weiter. Am Nachmittag ruft ein Mann an, der sich als Leiter der Kita vorstellt: „Ist Frau Kessler bei Ihnen? Ich muss wissen, was sie hat und wann sie wieder arbeiten kann.“", "Nach dem Schub plant der Arzt eine Rehabilitation. Physiotherapie und Ergotherapie sind angefordert. Am Abend sagt Frau Kessler zu Ihnen: „Ich will wieder arbeiten. Aber ich weiß nicht, wie ich das mit den Kindern und dem Job schaffen soll.“"], "vorbereitung": ["Den Fall den drei Kompetenzbereichen zuordnen: KB III (Team, andere Berufsgruppen, Einrichtung) · KB IV (Recht und Ethik) · KB V (pflegewissenschaftliche Modelle und Krankheitslehre) — und die eigene Berufsrolle in jedem Teil benennen.", "Für jede Antwort das Gerüst vorbereiten: Einschätzung → Begründung (weil …) → Kette (Ursache → Wirkung → Gefahr) → deshalb tue ich … .", "Werkzeuge in Stichworten bereitlegen: Phasenmodell nach Schaeffer und Moers, ICF-Modell, dialogisches Modell nach Heffels (7 Phasen), die drei Delegationsverantwortungen, § 203 StGB (Schweigepflicht), Autoritätsgradient und CRM-Leitsätze.", "MS-Grundlagen wiederholen: Definition, Schub (drei Bedingungen), Verlaufsformen, Schubtherapie und Schubprophylaxe, Cortison-Regeln, Fatigue.", "Die drei vorbehaltenen Tätigkeiten der Pflege und „Verantwortung = Antwort-Geben-können“ in eigenen Worten formulieren."], "fragen": [{"kb": "V", "frage": "In der Übergabe wird Frau Kessler als „unkooperativ“ bezeichnet. Wie ordnen Sie ihr Verhalten pflegewissenschaftlich ein?", "nachfragen": ["In welcher Phase nach Schaeffer und Moers sehen Sie Frau Kessler — und woran erkennen Sie das im Fall?", "Welche Phase liegt nicht vor, und warum?"], "erwartung": [{"text": "Phasenmodell nach Schaeffer und Moers: Bewältigungshandeln Erwachsener mit somatischer, chronisch-progredienter Erkrankung; Grundlage empirische Studien; Perspektivwechsel hin zur Sicht der Betroffenen.", "quelle": "schulung-rehabilitation/zusammenfassung.html"}, {"text": "Phase 4 „Auf und Ab der Krankheit“: Die Hoffnung auf Rückkehr ins normale Leben erweist sich als Trugschluss; die Erkrankten werden „von vorbildlichen zu normalen Patienten“, hinterfragen das Therapieregime und greifen stillschweigend in das Medikamentenregime ein — im Fall: Spritzen weggelassen, „wozu also?“.", "quelle": "schulung-rehabilitation/zusammenfassung.html"}, {"text": "In Phase 4 fühlen sich die Erkrankten „mit ihren Belangen und Nöten bagatellisiert“ — das Etikett „unkooperativ“ verstärkt genau das.", "quelle": "schulung-rehabilitation/zusammenfassung.html"}, {"text": "Das Modell bietet keine Handlungsvorschläge, hat idealtypischen Charakter und dient als Wissensgrundlage — Maßnahmen muss die Pflege selbst ableiten (z. B. aus der Rolle der Pflege: Beratung und Edukation).", "quelle": "schulung-rehabilitation/zusammenfassung.html"}, {"text": "Phase 5 und 6 liegen nicht vor: Phase 5 kündigt das Nahen des Lebensendes an — davon ist bei Frau Kessler nichts erkennbar. Zu sagen, welche Phase nicht vorliegt, gehört zur Einordnung (wie in der Lösung zum Fall „37 Grad“).", "quelle": "schulung-rehabilitation/zusammenfassung.html"}]}, {"kb": "V", "frage": "Frau Kessler fragt Sie: „Wozu die Spritzen, wenn trotzdem ein Schub kommt?“ Was antworten Sie ihr fachlich?", "nachfragen": ["Was kann passieren, wenn die Schubprophylaxe dauerhaft fehlt?", "Wie sprechen Sie die grippeähnlichen Nebenwirkungen an?"], "erwartung": [{"text": "Schubprophylaxe mit β-Interferonen greift tief in die Entzündungskaskade ein und reduziert die Schübe um 30–40 % — sie verhindert Schübe also nicht vollständig.", "quelle": "schulung-neurologie/zusammenfassung.html"}, {"text": "Nebenwirkung der β-Interferone: grippeähnliche Symptome — ihre Erfahrung ist also eine bekannte Nebenwirkung, kein Versagen von ihr.", "quelle": "schulung-neurologie/zusammenfassung.html"}, {"text": "RRMS ohne Behandlung: durchschnittlich 1,8 Schübe pro Jahr.", "quelle": "schulung-neurologie/zusammenfassung.html"}, {"text": "SPMS (sekundär progredient): Hauptursache ist eine unzureichende Therapie/Schubprophylaxe — Begründung, warum die Dauertherapie auch in beschwerdefreien Zeiten wichtig ist.", "quelle": "schulung-neurologie/zusammenfassung.html"}, {"text": "Rolle der Pflege: Beratung und Edukation; die Entscheidung über die Therapie bleibt ihre (Überleitung zu KB IV).", "quelle": "schulung-rehabilitation/zusammenfassung.html"}]}, {"kb": "IV", "frage": "Frau Kessler bleibt dabei: Sie will die Spritzen nicht mehr. Der Stationsarzt sagt im Dienstzimmer: „Dann ist sie eben selbst schuld.“ Wie gehen Sie mit dieser Situation um?", "nachfragen": ["Welche Werte stoßen hier zusammen?", "Was darf das Team tun, wenn Frau Kessler eine Behandlung ablehnt?"], "erwartung": [{"text": "Dialogisches Modell nach Heffels in sieben Phasen: Situationsdeutung · Problembestimmung · Zielbestimmung · allgemeine Vorgaben · Handlungsmöglichkeiten · Entscheidungsfindung · Evaluieren.", "quelle": "schulung-verantwortung/zusammenfassung.html"}, {"text": "Phase 2: Es kollidieren Autonomie (sie entscheidet selbst) mit Fürsorge und Nicht-Schaden (Risiko weiterer Schübe, Übergang in SPMS); die vier Prinzipien der Medizinethik: Autonomie, Fürsorge, Gerechtigkeit, Nicht-Schaden.", "quelle": "schulung-kommunikation/zusammenfassung.html"}, {"text": "Phase 4 Vorgaben: Gesetze, Leitbilder, Richtlinien, fachliche Standards, ICN-Kodex, ethische Prinzipien, Pflege-Charta (Recht auf Selbstbestimmung).", "quelle": "schulung-verantwortung/zusammenfassung.html · Wissen/023-prinzipien-der-koerperpflege.md"}, {"text": "Recht: Ein Heileingriff ist immer eine Körperverletzung und erst durch die Einwilligung gerechtfertigt — ohne ihre Einwilligung keine Behandlung.", "quelle": "schulung-recht/zusammenfassung.html"}, {"text": "Phase 5/6: Handlungsmöglichkeiten sammeln, auch schlechte; gewählt wird die mit der höchsten Wirkung und den geringsten Nebenwirkungen — wie in der Musterlösung Herr Möller ein gemeinsames Gespräch von Patientin, Arzt und Pflege, Risiken benennen, dokumentieren (der „dritte Weg“).", "quelle": "schulung-kommunikation/zusammenfassung.html"}, {"text": "Zum Satz des Arztes: Rogers' Akzeptanz — Abgrenzung von Person und Verhalten; die Entscheidung muss man nicht gut finden, die Person wird trotzdem wertgeschätzt.", "quelle": "schulung-kommunikation/zusammenfassung.html"}]}, {"kb": "IV", "frage": "Der Leiter der Kita ruft an und will wissen, ob Frau Kessler bei Ihnen liegt, was sie hat und wann sie wieder arbeiten kann. Was antworten Sie — und warum?", "nachfragen": ["Ist schon die Bestätigung, dass sie auf Station liegt, ein Problem?", "Unter welchen Bedingungen dürften Sie Auskunft geben?"], "erwartung": [{"text": "§ 203 StGB Verletzung von Privatgeheimnissen: Geheimnisträger sind die Heilberufe — die Pflegekraft steht unter Schweigepflicht.", "quelle": "schulung-recht/zusammenfassung.html"}, {"text": "Geheimnis = Tatsache, die nur ein begrenzter Personenkreis kennt und an deren Geheimhaltung die Patientin ein schutzwürdiges Interesse hat; dazu gehören Diagnose, Prognose — und schon die Identität und die bloße Tatsache der Behandlung → nicht einmal bestätigen, dass sie hier liegt.", "quelle": "schulung-recht/zusammenfassung.html"}, {"text": "Offenbaren = jede Mitteilung an einen Dritten, der es noch nicht (sicher) kennt — auch ein bestätigendes Nicken auf eine Vermutung.", "quelle": "schulung-recht/zusammenfassung.html"}, {"text": "Befugnis zum Offenbaren u. a. durch Einwilligung der einwilligungsfähigen Patientin (zur Beweissicherung schriftlich); die Weitergabe im Team ist kein Offenbaren.", "quelle": "schulung-recht/zusammenfassung.html"}, {"text": "Folgerung für die Antwort: keine Auskunft geben, freundlich auf die Schweigepflicht verweisen; Frau Kessler entscheidet selbst, ob und was sie ihrem Arbeitgeber mitteilt.", "quelle": "schulung-recht/zusammenfassung.html"}]}, {"kb": "III", "frage": "Mit welchen Berufsgruppen arbeiten Sie bei Frau Kessler zusammen, und was ist dabei Ihre eigene Aufgabe als Pflegefachperson?", "nachfragen": ["Welche Tätigkeiten sind der Pflege vorbehalten?", "Wie formulieren Sie Pflegeziele bei einer Patientin mit MS?"], "erwartung": [{"text": "Symptomatische Therapie ohne Medikamente: aktivierende Pflege, Physiotherapie, Logopädie, Ergotherapie; dazu der Arzt für Schubtherapie und Prophylaxe.", "quelle": "schulung-neurologie/zusammenfassung.html"}, {"text": "Pflege- und Behandlungsplan angepasst an Symptomatik und Verlauf (Symptome, Remission, Schubhäufigkeit); „Pflegeanamnese unerlässlich“; „Pflegeziele stets ressourcenerhaltend formulieren“.", "quelle": "schulung-neurologie/zusammenfassung.html"}, {"text": "Vorbehaltene Tätigkeiten (§ 4 PflBG): Erhebung und Feststellung des Pflegebedarfs und Planung der Pflege · Organisation, Gestaltung und Steuerung des Pflegeprozesses · Analyse, Evaluation, Sicherung und Entwicklung der Qualität.", "quelle": "examen-abschluss/examen.html"}, {"text": "Rolle der Pflege in der Rehabilitation: Aktivierung und Motivation · Beratung und Edukation · Alltagsorientierung · Teilhabeförderung.", "quelle": "schulung-rehabilitation/zusammenfassung.html"}, {"text": "Organisationen für Betroffene, die der Foliensatz nennt: Kompetenznetzwerk Multiple Sklerose, Deutsche Multiple Sklerose Gesellschaft (DMSG).", "quelle": "schulung-neurologie/zusammenfassung.html"}]}, {"kb": "III", "frage": "Sie haben sich in der Visite über die Uhrzeit der Cortisongabe gewundert und nichts gesagt. Wie beurteilen Sie Ihr Verhalten?", "nachfragen": ["Was spricht fachlich gegen eine Gabe am Abend?", "Wie hätten Sie Ihre Zweifel ansprechen können — und was machen Sie jetzt?"], "erwartung": [{"text": "Cortison: Einnahme möglichst morgens, weil der körpereigene Spiegel morgens am höchsten ist und Cortisol wach macht; außerdem Blutzuckerkontrollen (Hyperglykämie als Nebenwirkung).", "quelle": "schulung-neurologie/zusammenfassung.html"}, {"text": "Autoritätsgradient: der zu große (oder nicht existierende) hierarchische Unterschied zwischen Personen; Folgen u. a.: Zweifel an Therapie und Pflege werden nicht geäußert, höhere Patientengefährdung durch unangesprochene Fehlanordnungen.", "quelle": "schulung-kommunikation/zusammenfassung.html"}, {"text": "CRM-Leitsätze: Nr. 7 „Kommuniziere sicher und effektiv — sag, was Dich bewegt“ · Nr. 10 „Habe Zweifel und überprüfe genau“ · Nr. 3 „Fordere Hilfe an — lieber früh als spät“.", "quelle": "schulung-kommunikation/zusammenfassung.html"}, {"text": "„Pflegepersonen sind für das Tun oder das Lassen verantwortlich“ — Schweigen ist auch eine Entscheidung.", "quelle": "schulung-verantwortung/zusammenfassung.html"}, {"text": "Reflexion nach Gibbs: Beschreibung · Gefühle · Bewertung · Analyse · Schlussfolgerung · Aktionsplan (z. B. jetzt Rückfrage beim Arzt oder über die Praxisanleitung, künftig in der Visite nachfragen).", "quelle": "schulung-kommunikation/zusammenfassung.html"}]}, {"kb": "V", "frage": "Die Kollegin sagt über Frau Kessler: „Die ist einfach faul — das kennt man doch.“ Wie reagieren Sie fachlich begründet?", "nachfragen": ["Auf welche Art von Entscheidungsgrundlage stützt sich die Kollegin?", "Was bedeutet das für die Tagesplanung von Frau Kessler?"], "erwartung": [{"text": "Fatigue ist ein MS-Symptom (Psyche: über 50 % betroffen) und tritt auch unabhängig vom Behinderungsgrad auf; Symptome schwanken tageszeitlich.", "quelle": "schulung-neurologie/zusammenfassung.html"}, {"text": "Wenig rationale Entscheidungswege: Intuition, Erfahrung, Tradition („das machen wir immer so“), Versuch und Irrtum; rational: Wissenschaft, Problemlösungsprozess, dialogisches Modell.", "quelle": "schulung-verantwortung/zusammenfassung.html"}, {"text": "Bestätigungsfehler: Man sucht nur Informationen, die die eigene Meinung bestätigen (Beispiel aus dem Workshop: „Der Auszubildende ist unmotiviert“).", "quelle": "schulung-kommunikation/zusammenfassung.html"}, {"text": "„Verstehen geht vor Handeln!“ — und Rogers' Akzeptanz: nicht werten, Person und Verhalten trennen.", "quelle": "schulung-kommunikation/zusammenfassung.html"}, {"text": "Folgerung: anstrengende Aktivitäten dorthin planen, wo sie es kann; Pflegeziele ressourcenerhaltend formulieren.", "quelle": "schulung-neurologie/zusammenfassung.html"}]}, {"kb": "III", "frage": "Frau Kessler will wieder arbeiten. Wie bereiten Sie gemeinsam mit dem Team die Zeit nach dem Krankenhaus vor?", "nachfragen": ["Welcher Kostenträger ist für ihre Reha zuständig?", "Wie beschreiben Sie ihre Situation mit der ICF?"], "erwartung": [{"text": "Rehabilitation soll ein möglichst selbstständiges und selbstbestimmtes Leben mit Teilnahme an relevanten oder gewünschten Lebensaktivitäten ermöglichen; Ziele u. a. (Wieder-)Eingliederung in den Arbeitsprozess und Verhindern von Rückfällen (tertiäre Prävention).", "quelle": "schulung-rehabilitation/zusammenfassung.html"}, {"text": "Kostenträger nach Ziel: Rentenversicherung = Erwerbsfähigkeit; Krankenversicherung = Gesundheit; Unfallversicherung = Arbeitsunfall/Berufserkrankung; Pflegeversicherung = Vermeidung/Reduktion von Pflegebedürftigkeit.", "quelle": "schulung-rehabilitation/zusammenfassung.html"}, {"text": "ICF (WHO, biopsychosoziales Modell) — die ICD sagt, was jemand hat, die ICF, was das für sein Leben bedeutet; Ebenen: Gesundheitsproblem · Körperfunktionen und -strukturen · Aktivitäten · Partizipation · Umweltfaktoren · personenbezogene Faktoren — im Fall z. B. Sehstörung/Gangunsicherheit, Beruf als Erzieherin, zwei Kinder, Familie.", "quelle": "schulung-rehabilitation/zusammenfassung.html"}, {"text": "Rolle der Pflege: Teilhabeförderung, Alltagsorientierung, Beratung und Edukation; Abstimmung mit Physio- und Ergotherapie.", "quelle": "schulung-rehabilitation/zusammenfassung.html · schulung-neurologie/zusammenfassung.html"}]}, {"kb": "IV", "frage": "Was heißt für Sie in diesem Fall „verantwortlich handeln“ — als zukünftige Pflegefachfrau?", "nachfragen": ["Sind Sie auch für das verantwortlich, was Sie nicht getan haben?", "Was gilt, wenn Ihnen eine Aufgabe delegiert wird, die Sie sich nicht zutrauen?"], "erwartung": [{"text": "Verantwortung heißt „Antwort-Geben-können“ — gute Gründe anführen; verantwortlich ist man für Handeln (bewusstes Tun), nicht nur für routiniertes Verhalten.", "quelle": "schulung-verantwortung/zusammenfassung.html"}, {"text": "Drei Teile der Verantwortung: Zuständigkeit · Kompetenz („Denken-Können“) · Reichweite („nach bestem Wissen und Gewissen“, die Folgen im Blick).", "quelle": "schulung-verantwortung/zusammenfassung.html"}, {"text": "Delegation: Anordnungsverantwortung (Auswahl, Anleitung, Überwachung) · Übernahmeverantwortung (Kann ich das? Darf ich das? Bin ich eingewiesen? — sonst ablehnen) · Durchführungsverantwortung.", "quelle": "schulung-recht/zusammenfassung.html"}, {"text": "Intrapersonaler Konflikt, z. B. persönliche Werte gegen berufliche Vorgaben — kann körperliche Symptome verursachen; benennen ist der erste Schritt.", "quelle": "schulung-verantwortung/zusammenfassung.html"}, {"text": "Bezug zum Prüfungsschwerpunkt: Auseinandersetzung mit der eigenen Berufsrolle und dem beruflichen Selbstverständnis (§ 15 Abs. 1 PflAPrV).", "quelle": "examen-abschluss/examen.html"}]}], "quellen": ["Wissen/023-prinzipien-der-koerperpflege.md", "examen-abschluss/examen.html", "examen-werkstatt/index.html", "schulung-kommunikation/zusammenfassung.html", "schulung-neurologie/zusammenfassung.html", "schulung-recht/zusammenfassung.html", "schulung-rehabilitation/zusammenfassung.html", "schulung-verantwortung/zusammenfassung.html"], "luecken": ["Beratung/Schulung de patients (modèles de conseil, éducation thérapeutique) : pas de cours spécifique dans le dépôt — seulement « Beratung & Edukation » comme rôle de la Pflege en réadaptation.", "Cortisone en Stoßtherapie : voie d'administration et horaire précis ne sont pas dans ses documents ; la règle « möglichst morgens » vient de la diapo générale « unverzichtbar » (cortisone en général).", "β-Interferon : pas de technique d'injection, pas de gestion des effets secondaires dans ses documents (seulement « grippeähnliche Symptome »).", "Entlassungsmanagement : pas d'Expertenstandard Entlassungsmanagement dans le dépôt ; la phrase sur le DRG figure sur la page Rehabilitation mais la « chaîne » y est marquée comme ajout de Claude → non utilisée.", "Closed Loop, FOR-DEC, Fixierungsfehler, 10-für-10-Prinzip : seulement nommés, pas de contenu → non demandés.", "ICN-Kodex : contenu absent (cours de Mme Nix CE 1 UE 6 manquant) ; Pflege-Charta seulement en liste de droits (Wissen/023).", "Teamarbeit/Fallbesprechung interprofessionnelle (KB III) : pas de cours dédié ; les attentes s'appuient sur MS (thérapie symptomatique), Rehabilitation et Kommunikation in Notfallsituationen.", "Le cas réel du cours (Frau Schubert, MS, ambulance neurologique) existe sans corrigé ; m1 utilise un cas fictif différent pour ne pas recouper ses exercices."], "fiktiv": ["Tous les noms et détails personnels : Frau Nadine Kessler, 41 ans, Erzieherin, mariée, deux enfants (8 et 11 ans), MS depuis 6 ans.", "Le Schub actuel (œil gauche, chutes), l'arrêt des injections il y a 4 mois, les citations de la patiente et de la collègue.", "La visite de 11 h, l'heure de cortisone fixée à 20 h « organisatorisch », l'appel du directeur de la Kita, la réadaptation prévue."]}], "tipps": {"_quelle": "recherche/examen-nrw-fragestil.md (Recherche vom 03.11.2026). Alles hier sind Internetquellen, keine Unterlagen ihrer Schule. Echte NRW-Klausuren sind nicht öffentlich.", "quellen": {"1": {"t": "PflAPrV § 14 (amtlich)", "u": "https://www.gesetze-im-internet.de/pflaprv/__14.html"}, "2": {"t": "PflAPrV § 15 (amtlich)", "u": "https://www.gesetze-im-internet.de/pflaprv/__15.html"}, "5": {"t": "Bezirksregierung Düsseldorf (amtlich, NRW)", "u": "https://www.brd.nrw.de/Themen/Gesundheit-Soziales/Gesundheitsfachberufe/Pflegefachfrauen-und-Pflegefachmaenner"}, "6": {"t": "MAGS NRW, INTRO NW, Schulung Prüfungsgestaltung 2022 (Land NRW)", "u": "https://www.mags.nrw/system/files/media/document/file/intro_nw_implementierung_2_gesamtpraesentation_version_zur_veroeffentlichung_aktualisiert.pdf"}, "7": {"t": "Leitfaden Baden-Württemberg zur schriftlichen Abschlussprüfung, 2022 (Land BW)", "u": "https://sozialministerium.baden-wuerttemberg.de/fileadmin/redaktion/m-sm/intern/downloads/Downloads_Gesundheits-_Pflegeberufe/Leitfaden_schriftliche-Abschlusspruefung-Berufsfachschulen-Pflege.pdf"}, "8": {"t": "CurAP/Neksa: Kompetenzorientierte schriftliche Prüfungen gestalten, 2021 (Berlin/Brandenburg)", "u": "https://doi.org/10.26127/BTUOpen-5655"}, "9": {"t": "CurAP/Neksa: Musterklausuren, 2021 (Berlin/Brandenburg)", "u": "https://www.eh-berlin.de/fileadmin/Redaktion/2_PDF/FORSCHUNG/Alte_Dateien/Projekt_CurAP/Didaktische_Impulse_Handreichungen/Musterklausuren_zur_Handreichung_CurAP_Neksa_2021.pdf"}, "10": {"t": "Neksa: Kompetenzorientierte mündliche Prüfungen gestalten (Brandenburg)", "u": "https://www-docs.b-tu.de/fg-bildungswissenschaften-gesundheit/public/Forschung/Neksa/Neksa_Handlungsempfehlung%20m%C3%BCndliche%20Pr%C3%BCfung_Juni%202022.pdf"}, "11": {"t": "Hamburg, Sozialbehörde: Handreichung mündliche Abschlussprüfung, Stand 03/2026 (amtlich)", "u": "https://www.hamburg.de/resource/blob/1159722/dd9679bbdc4e389fe7d05f78ff813317/handreichung-muendliche-abschlusspruefung-gemaess-pflbg-data.pdf"}, "12": {"t": "Klepsch/Herrmann: Prüfung Pflegefachperson mündlich und praktisch, Elsevier 2025 (Verlag)", "u": "https://shop.elsevier.de/media/wysiwyg/PDF/DE/9783437251535_Klepsch_Pflegepruefung.pdf"}, "14": {"t": "VG Bremen, Urteil vom 13.02.2026, 1 K 2780/25 (Gericht)", "u": "https://www.verwaltungsgericht.bremen.de/sixcms/media.php/13/25_2780_K_1.pdf"}}, "ablauf": [{"text": "Drei Aufsichtsarbeiten à 120 Minuten, in der Regel an drei aufeinanderfolgenden Werktagen. Jede einzelne muss mindestens „ausreichend“ sein — eine gute Arbeit gleicht eine schlechte nicht aus.", "q": ["1"]}, {"text": "Die Aufgaben schlägt deine eigene Pflegeschule vor, die Behörde wählt aus. Zwei Lehrkräfte deiner Schule benoten jede Arbeit. In NRW führt die Bezirksregierung den Vorsitz (ohne Fragerecht). Darum zählen die Unterlagen und Operatorenlisten deiner Schule am meisten.", "q": ["1", "5"]}, {"text": "Die drei Fälle unterscheiden sich in Altersstufe, Umfeld und Versorgungsbereich — so wie in deiner Matrix (alter Mensch/Pflegeheim · Erwachsene/ambulant · Kind/Krankenhaus).", "q": ["1"]}, {"text": "NRW-Lehrkräfte wurden geschult, neben dem Fall eine Ebene mitzudenken: Tag 1 gesellschaftlich, Tag 2 gesellschaftlich-beruflich, Tag 3 interprofessionell. Rechne also mit Fragen zu Versorgungssystem, Recht oder Team — nicht nur zur Pflege am Bett.", "q": ["6"]}, {"text": "Ein Fall ist höchstens etwa eine Seite (ca. 500 Wörter), mit wörtlicher Rede und mehreren Sichtweisen. Plane 10–15 Minuten nur zum Lesen ein.", "q": ["7", "8"]}, {"text": "Alle Themen des Tages hängen an EINEM Menschen: Pflegeprozess, Expertenstandard, Beratung/Kommunikation, Recht und Krankheit/Medikament kommen im selben Fall vor.", "q": ["7", "9"]}], "lesen": ["Lies den Fall zweimal. Beim zweiten Mal mit Stift.", "Wer ist beteiligt? Wie sieht jede Person die Lage (wörtliche Rede!)?", "Welche Pflegephänomene, welche Ressourcen, welches Setting?", "Was bleibt offen? Wenn Informationen fehlen, darfst und sollst du das sagen („Die Informationen reichen nicht aus, um … — ich würde noch erfragen …“)."], "lesenQ": ["8"], "fallen": [{"falle": "Allgemein antworten, ohne den Fall", "richtig": "Jede Aussage an den Fall binden: „Bei Frau L. zeigt sich das daran, dass …“", "q": ["8", "7"]}, {"falle": "Mehr in den Fall hineinlesen, als dasteht", "richtig": "Beschreiben, deuten, bewerten trennen. Fehlende Information benennen ist eine gültige Antwort.", "q": ["8"]}, {"falle": "Den zweiten Operator übersehen (z. B. Ressourcen nur nennen statt bewerten)", "richtig": "Aufgabe zerlegen: jeden Operator einzeln und sichtbar abarbeiten (erst nennen, dann begründen).", "q": ["8", "7"]}, {"falle": "Mengenangabe ignorieren", "richtig": "Genau so viele Punkte wie verlangt — die Punkte sind „je“ Nennung verteilt.", "q": ["7", "9"]}, {"falle": "Nennungen ohne Trennschärfe (dreimal fast dasselbe)", "richtig": "Verschiedene Bereiche abdecken (z. B. verschiedene SIS-Themenfelder oder ABEDL).", "q": ["8", "9"]}, {"falle": "Nur Stichworte", "richtig": "Wer in ganzen, zusammenhängenden Sätzen antwortete, bekam in der Erprobung häufig mehr Punkte.", "q": ["8", "9"]}, {"falle": "Aufgabe leer lassen", "richtig": "Etwas schreiben: Teilpunkte gibt es auch für Teilwissen und Praxiswissen.", "q": ["8"]}, {"falle": "Folgefehler (Teilaufgabe b falsch, dann c unlösbar)", "richtig": "Zwischenergebnisse klar hinschreiben; die Teilaufgaben bauen aufeinander auf.", "q": ["8"]}, {"falle": "Problem aus Sicht der Pflege statt „aus Sicht“ der Person", "richtig": "Wenn die Aufgabe die Sicht der Person verlangt: ihre eigene Wahrnehmung (wie in der SIS) formulieren.", "q": ["7", "9"]}, {"falle": "Expertenstandard nur erwähnen", "richtig": "Ihn als Raster benutzen: Risikobereiche des Standards einzeln am Fall prüfen, dann eine Gesamteinschätzung.", "q": ["7", "9"]}, {"falle": "PESR unvollständig", "richtig": "Problem + Einflussfaktoren (Ätiologie) + Symptome + Ressourcen.", "q": ["7"]}, {"falle": "Maßnahme ohne Begründung", "richtig": "Kette: Problem → Grund → individuelle Maßnahme → wie prüfe ich die Wirksamkeit. Oft 1 Punkt für die Maßnahme, 1 Punkt für die Begründung.", "q": ["7", "9"]}, {"falle": "Ärztliche Anordnung: nur „ich darf das“", "richtig": "Anordnung (schriftlich) + eigene Qualifikation + Durchführungsverantwortung; nur übernehmen, wofür man ausgebildet ist.", "q": ["7"]}, {"falle": "Ethisches Dilemma nur als „Problem“ beschreiben", "richtig": "Definition (zwei sich ausschließende Handlungsoptionen) + die Optionen + Kriterien/Prinzipien + begründete Entscheidung.", "q": ["7"]}, {"falle": "„Beurteilen“ mit persönlicher Meinung", "richtig": "Beurteilen = an Kriterien prüfen, ohne persönlich Stellung zu beziehen. „Diskutieren“ = Pro und Contra bis zu einer begründeten Bewertung.", "q": ["7"]}], "operatoren": [{"niveau": "I", "liste": "nennen / benennen / angeben (ohne Kommentar) · beschreiben · ergänzen · identifizieren · vervollständigen"}, {"niveau": "II", "liste": "begründen · ableiten · darstellen · erarbeiten · erklären (kausal herleiten) · erläutern · formulieren · vergleichen · zuordnen"}, {"niveau": "III", "liste": "beurteilen (Kriterien, ohne persönliche Stellung) · bewerten (an Wert- oder wissenschaftlichen Kriterien) · diskutieren (Pro/Contra → begründete Bewertung) · entwickeln"}], "operatorenQ": ["7"], "operatorenHinweis": "So definiert der Leitfaden Baden-Württemberg die Operatoren. Deine Schule kann eine eigene Liste haben — die gilt dann vor dieser.", "muendlich": [{"text": "30–45 Minuten, Kompetenzbereiche III, IV und V an einer komplexen Aufgabe. Der Fall kommt aus einem anderen Versorgungsbereich und einer anderen Altersstufe als deine praktische Prüfung. Schwerpunkt: deine Berufsrolle, Team, Einrichtung, Gesellschaft.", "q": ["2"]}, {"text": "Vorbereitungszeit: in Hamburg 30 Minuten, in Brandenburg und im Elsevier-Modell 20 Minuten. Für NRW wurde keine Angabe gefunden — frag deine Schule.", "q": ["11", "10", "12"]}, {"text": "Typischer Einstieg: „Fassen Sie zusammen, worum es in der Fallsituation im Wesentlichen geht.“ Danach ein Fachgespräch; die Prüfenden passen ihre Fragen an.", "q": ["10"]}, {"text": "Biete dein Wissen von dir aus an, schlage Brücken zwischen den Themen und bring zu jedem Thema ein Praxisbeispiel.", "q": ["12"]}, {"text": "Nachfragen ist erlaubt, wenn du eine Frage nicht verstehst. Prüfende sollen bei geringeren Sprachkenntnissen geduldig sein.", "q": ["12", "10"]}, {"text": "Ein echter Fall vor Gericht (2026): Die Note 6 wurde u. a. damit begründet, dass rechtliches Wissen fehlte und Pro- und Contra-Argumente „schleppend“ kamen. Recht und Pro/Contra also gezielt üben.", "q": ["14"]}, {"text": "Bewertungsmodell aus einem Lehrbuch: Fallbezug und theoriegeleitete Begründung 60 %, Fachsprache/Kommunikation 20 %, Selbstständigkeit 10 %, Zielgerichtetheit 10 %. Kein NRW-Schlüssel gefunden.", "q": ["12"]}], "leitfragen": ["Fassen Sie den vorliegenden Fall mit eigenen Worten zusammen.", "Erläutern Sie die intra- und interprofessionellen Handlungsbedarfe …", "Stellen Sie dar, welche Gesetze, Verordnungen oder Leitlinien … zum Tragen kommen könnten.", "Beschreiben Sie, welche wissenschaftlichen Erkenntnisse und/oder berufsethischen Werthaltungen … (die Pflegefachperson) berücksichtigen könnte."], "leitfragenQ": ["11"], "leitfragenHinweis": "So stehen die Leitfragen in Hamburg unter dem Fall (gekürzt, „…“ = ausgelassen). Für NRW nicht belegt — als Gerüst für deine Vorbereitung trotzdem gut."}};
